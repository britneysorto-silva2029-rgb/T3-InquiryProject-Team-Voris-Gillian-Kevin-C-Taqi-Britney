<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <div class="logo-box">
                LOGO
            </div>

            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Book</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contact Title -->
    <section class="contact-title">
        <h1>Contact Us</h1>
    </section>

    <!-- Employees -->
    <section class="employees-section">
        <h2>Employees</h2>

        <div class="employee-grid">
            <div class="person-card">
                <div class="image-placeholder"></div>
                <p>Adriana</p>
            </div>

            <div class="person-card">
                <div class="image-placeholder"></div>
                <p>Angel</p>
            </div>

            <div class="person-card">
                <div class="image-placeholder"></div>
                <p>Jose</p>
            </div>

            <div class="person-card">
                <div class="image-placeholder"></div>
                <p>Carlos</p>
            </div>

            <div class="person-card">
                <div class="image-placeholder"></div>
                <p>Mary</p>
            </div>

            <div class="person-card">
                <div class="image-placeholder"></div>
                <p>Maria</p>
            </div>

            <div class="person-card">
                <div class="image-placeholder"></div>
                <p>Candida</p>
            </div>
        </div>
    </section>

    <!-- Owners -->
    <section class="owners-section">
        <h2>Owners</h2>

        <div class="owner-grid">
            <div class="person-card owner-card">
                <div class="large-image-placeholder"></div>
                <p>Pedro</p>
            </div>

            <div class="person-card owner-card">
                <div class="large-image-placeholder"></div>
                <p>Andrés</p>
            </div>
        </div>
    </section>

    <!-- Footer Message -->
    <section class="help-box">
        <p>
            If you have any issues, contact the employees or the owners
            for further help.
        </p>
    </section>

</body>
</html>
